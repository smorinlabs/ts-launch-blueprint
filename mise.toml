# mise toolchain — one of the project's three first-class dev environments,
# alongside native per-tool installs (Makefile + Justfile `install-*` targets,
# scripts/install-*.sh) and the flox env (.flox/env/manifest.toml).
# Keep all three synced when adding or removing a tool.
#
# Intentionally NOT declared here:
#   * Workspace devDependencies (oxfmt, oxlint, vitest, cspell, commitlint,
#     dependency-cruiser, tsdown, typescript, git hooks) install via
#     `pnpm install` into node_modules/.bin/ (single version source is
#     pnpm-lock.yaml; avoids mise shim drift).
#   * Python-only linters/formatters are omitted (this TS repo uses cspell
#     and oxfmt for spelling and YAML/TOML/JSON/Markdown formatting).
[tools]
node = "24" # matches .nvmrc
pnpm = "10.34.3" # matches package.json packageManager
just = "latest"
actionlint = "1.7.12" # matches scripts/install-actionlint.sh
shellcheck = "0.11.0" # matches scripts/install-shellcheck.sh
gitleaks = "8.27.2" # matches scripts/install-gitleaks.sh
editorconfig-checker = "4.0.2" # matches scripts/install-editorconfig-checker.sh
gh = "latest"
make = "latest" # optional if system make is already installed
bun = "1.3.14" # optional advisory dev/test lane (D-036; matches ci.yml)
uv = "latest" # optional; required only for `just press-verify`
