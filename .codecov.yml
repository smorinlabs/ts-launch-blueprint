codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '70...100'
  # Keep coverage from silently eroding vs. PR base; threshold absorbs measurement noise.
  # Patch: new/changed lines require 80% coverage.
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: 'reach,diff,flags,footer'
  behavior: default
  require_changes: true

flags:
  unittests:
    paths:
      - packages/
      - apps/
