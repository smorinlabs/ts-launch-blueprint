# Git hooks (D-020(1,6)): lefthook 2.x replaces the source's pre-commit
# framework. Activated by `pnpm install` via the package.json "prepare" script,
# or manually with `just setup-hooks`.
#
# CI parity: `just pre-commit-run` runs the same underlying gates on ALL files
# (format-check + lint + typecheck + test) — the source's `pre-commit-run`
# intent without a Python runtime.

pre-commit:
  parallel: false
  jobs:
    - name: shellcheck
      glob: '*.{sh,bash}'
      run: bash scripts/check-shell.sh {staged_files}
    - name: actionlint
      glob: '.github/workflows/*.{yml,yaml}'
      run: |
        command -v actionlint >/dev/null 2>&1 || { echo "FAIL: actionlint missing — run just install-shell-tools" >&2; exit 1; }
        command -v shellcheck >/dev/null 2>&1 || { echo "FAIL: shellcheck missing — run just install-shell-tools" >&2; exit 1; }
        actionlint {staged_files}
    - name: editorconfig-checker
      run: |
        command -v editorconfig-checker >/dev/null 2>&1 || { echo "FAIL: editorconfig-checker missing — run just install-editorconfig-checker" >&2; exit 1; }
        editorconfig-checker -config .editorconfig-checker.json {staged_files}
    - name: cspell
      env:
        pnpm_config_verify_deps_before_run: ''
        npm_config_verify_deps_before_run: ''
      run: pnpm exec cspell lint --no-progress --no-must-find-files --files {staged_files}
    - name: pnpm-lock-check
      glob: '{package.json,**/package.json,pnpm-workspace.yaml,pnpm-lock.yaml}'
      run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts
    # Formatter on staged files; auto-fixes are re-staged (stage_fixed).
    # Source pre-commit hygiene hooks, mapped (D-020(6)):
    #   delegated to oxfmt (D-014(7)): end-of-file-fixer, trailing-whitespace,
    #     yamlfmt, taplo format, and the parse-validity intent of
    #     check-yaml/check-toml for the formats oxfmt formats;
    #   implemented below as check-large-files: check-added-large-files.
    # exclude mirrors .oxfmtrc.json ignorePatterns (meta-test enforces the
    # mirror): oxfmt exits 2 when every path it is given is ignore-listed, so
    # excluded files must never reach it — lefthook skips the job when no
    # staged files remain. --no-error-on-unmatched-pattern is drift insurance
    # for ignorePatterns entries added without a matching exclude here.
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,yml,yaml,toml,md}'
      exclude:
        - 'docs/port/TS_PORT_*.md'
        - 'docs/port/TS_EXISTING_REPO_REVIEW.md'
        - 'docs/port/goal.md'
        - 'docs/port/typescript_port_process_prompt.md'
        - '.claude/settings.local.json'
        - 'CHANGELOG.md'
        - 'CONTRIBUTORS.md'
      env:
        pnpm_config_verify_deps_before_run: ''
        npm_config_verify_deps_before_run: ''
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Reject staged files larger than 1MB outside docs/assets/ (mirrors
    # .github/workflows/large-file-guard.yml).
    - name: check-large-files
      run: |
        status=0
        for file in {staged_files}; do
          case "$file" in docs/assets/*) continue ;; esac
          if [ -f "$file" ]; then
            size=$(wc -c < "$file" | tr -d ' ')
            if [ "$size" -gt 1048576 ]; then
              echo "File too large (> 1MB): $file ($size bytes); use docs/assets/ or remove it" >&2
              status=1
            fi
          fi
        done
        exit $status
    # Linter on staged source files (curated correctness+suspicious set).
    # exclude mirrors .oxlintrc.json ignorePatterns for the same reason as the
    # format job: oxlint exits 1 when every given path is ignore-listed.
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      exclude:
        - '**/dist/**'
        - 'coverage/**'
      env:
        pnpm_config_verify_deps_before_run: ''
        npm_config_verify_deps_before_run: ''
      run: pnpm exec oxlint {staged_files}
    # Architecture boundaries (D-042) over the WHOLE import graph, not only
    # staged files: a staged change can break a rule elsewhere in the graph.
    - name: boundaries
      glob: '*.{ts,tsx}'
      env:
        pnpm_config_verify_deps_before_run: ''
        npm_config_verify_deps_before_run: ''
      run: just check-boundaries
    # Type check runs on the FULL program, not per-file — tsc semantics need
    # the whole graph (mirrors the source's repo-wide mypy hook).
    - name: typecheck
      env:
        pnpm_config_verify_deps_before_run: ''
        npm_config_verify_deps_before_run: ''
      run: sh scripts/typecheck.sh
    # Secret scan over staged diff (skipped in CI where secret-scan.yml runs
    # TruffleHog over PR diffs / push history).
    - name: gitleaks
      run: |
        if [ "${CI:-}" = "true" ]; then
          echo "gitleaks skipped in CI (secret-scan.yml covers CI)"
        else
          bash scripts/check-gitleaks.sh --staged
        fi

commit-msg:
  jobs:
    # Conventional Commits with the 100/200/200/type contract
    # (commitlint.config.mjs; Q9.A).
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Tests run at the push boundary, NOT per commit (D-020(3)): per-commit full
# suites tax contributor DX and train --no-verify; CI is the backstop.
# Opt-in: export TS_PROJECTS_PREPUSH_TESTS=1 to enable locally.
pre-push:
  parallel: true
  jobs:
    - name: gitleaks-range
      run: bash scripts/check-gitleaks.sh --range
    - name: press-verify
      run: just press-verify
    - name: test
      run: |
        if [ "${TS_PROJECTS_PREPUSH_TESTS:-0}" = "1" ]; then
          just test
        else
          echo "pre-push tests skipped (opt-in: TS_PROJECTS_PREPUSH_TESTS=1)"
        fi
