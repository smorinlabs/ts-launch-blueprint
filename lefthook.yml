# Git hooks (D-020(1,6)): lefthook 2.x replaces the source's pre-commit
# framework. Activated by `pnpm install` via the package.json "prepare" script,
# or manually with `just setup-hooks`.
#
# CI parity: `just pre-commit-run` runs the same underlying gates on ALL files
# (format-check + lint + typecheck + test) — the source's `pre-commit-run`
# intent without a Python runtime.

pre-commit:
  parallel: true
  jobs:
    # Formatter on staged files; auto-fixes are re-staged (stage_fixed).
    # Source pre-commit hygiene hooks, mapped (D-020(6)):
    #   delegated to oxfmt (D-014(7)): end-of-file-fixer, trailing-whitespace,
    #     yamlfmt, taplo format, and the parse-validity intent of
    #     check-yaml/check-toml for the formats oxfmt formats;
    #   implemented below as check-large-files: check-added-large-files.
    # exclude mirrors .oxfmtrc.json ignorePatterns (meta-test enforces the
    # mirror): oxfmt exits 2 when every path it is given is ignore-listed, so
    # excluded files must never reach it — lefthook skips the job when no
    # staged files remain. --no-error-on-unmatched-pattern is drift insurance
    # for ignorePatterns entries added without a matching exclude here.
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,jsonc,yml,yaml,md}'
      exclude:
        - 'docs/port/TS_PORT_*.md'
        - 'docs/port/TS_EXISTING_REPO_REVIEW.md'
        - 'docs/port/goal.md'
        - 'docs/port/typescript_port_process_prompt.md'
        - '.claude/settings.local.json'
        - 'CHANGELOG.md'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # Reject staged files larger than 500KB (pre-commit's
    # check-added-large-files intent; dependency-free POSIX shell).
    - name: check-large-files
      run: |
        status=0
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            size=$(wc -c < "$file")
            if [ "$size" -gt 512000 ]; then
              echo "File too large (> 500KB): $file ($size bytes)"
              status=1
            fi
          fi
        done
        exit $status
    # Linter on staged source files (curated correctness+suspicious set).
    # exclude mirrors .oxlintrc.json ignorePatterns for the same reason as the
    # format job: oxlint exits 1 when every given path is ignore-listed.
    - name: lint
      glob: '*.{ts,tsx,js,mjs,cjs}'
      exclude:
        - 'dist/**'
        - 'coverage/**'
      run: pnpm exec oxlint {staged_files}
    # Type check runs on the FULL program, not per-file — tsc semantics need
    # the whole graph (mirrors the source's repo-wide mypy hook).
    - name: typecheck
      run: pnpm exec tsc --noEmit

commit-msg:
  jobs:
    # Conventional Commits with the source 50/72/type contract
    # (commitlint.config.mjs; replaces gitlint + cog install-hook, D-020(2,5)).
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Tests run at the push boundary, NOT per commit (D-020(3)): per-commit full
# suites tax contributor DX and train --no-verify; CI is the backstop.
# Opt-in: export TS_PROJECTS_PREPUSH_TESTS=1 to enable locally.
pre-push:
  jobs:
    - name: test
      run: |
        if [ "${TS_PROJECTS_PREPUSH_TESTS:-0}" = "1" ]; then
          just test
        else
          echo "pre-push tests skipped (opt-in: TS_PROJECTS_PREPUSH_TESTS=1)"
        fi
