# Dependabot configuration (D-022(8)).
#
# Closes the SECURITY.md/dependabot mismatch and keeps the hybrid pinning policy
# honest: the github-actions ecosystem is what refreshes the SHA-pinned
# third-party actions (setup-just, osv-scanner) declared in .github/workflows/;
# the npm ecosystem covers runtime/dev dependencies. Minor+patch updates are
# grouped to keep bump PRs low-noise (D-022(9) rationale).
version: 2
updates:
  # GitHub Actions used by the workflows in .github/workflows/.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      github-actions:
        patterns:
          - '*'

  # Runtime + dev dependencies (package.json / pnpm-lock.yaml). Dependabot's
  # ecosystem id for pnpm is still 'npm' — it reads the pnpm lockfile (D-035).
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 5
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'npm'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    groups:
      lint-and-format:
        patterns:
          - 'oxlint*'
          - 'oxfmt*'
          - '@commitlint/*'
          - 'dependency-cruiser'
          - 'publint'
          - '@arethetypeswrong/cli'
          - 'lefthook'
      test:
        patterns:
          - 'vitest*'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
      build-and-types:
        patterns:
          - 'typescript'
          - 'tsdown'
          - 'tsx'
          - 'vite'
          - '@vitejs/*'
          - '@swc/*'
          - '@types/*'
      runtime-core-cli:
        patterns:
          - 'zod'
          - 'commander'
          - '@inquirer/*'
          - 'cli-table3'
          - 'clipboardy'
          - 'picocolors'
          - 'smol-toml'
          - 'yocto-spinner'
      runtime-api-web:
        patterns:
          - 'hono'
          - '@hono/*'
          - '@trpc/*'
          - '@tanstack/*'
          - 'react'
          - 'react-dom'
          - 'pino'
          - 'pino-pretty'
          - 'prom-client'
          - '@opentelemetry/*'
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
