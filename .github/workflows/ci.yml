# SPDX-License-Identifier: MIT

# CI — slim PR gates + 4-cell cross-OS matrix for the TypeScript port (P03).
#
# `changes` gates heavy jobs on docs-only and verified release-please PRs;
# `lint` (including `docs-check`) always runs; `ci-ok` is the single aggregate
# gate for rulesets / merge queues (skipped jobs count as success).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue emits merge_group (not pull_request) for its speculative
  # merge — without this trigger the ci-ok required check never reports and
  # every queue entry deadlocks at "Expected".
  merge_group:

# Deny-all baseline (D-022(10)); each job below re-grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect whether a PR touches code beyond docs/prose or is a verified
  # release-please version bump, so heavy jobs skip when safe.
  changes:
    name: changes
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      release: ${{ steps.detect.outputs.release }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          emit() {
            {
              echo "code=$1"
              echo "release=$2"
              echo "web=$3"
            } >> "$GITHUB_OUTPUT"
          }
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            emit true false true
            echo "INFO: ${EVENT_NAME} event - running all jobs"
            exit 0
          fi
          changed="$(git diff --no-renames --name-only "${BASE_SHA}...HEAD")"
          # No `grep -q` below: it exits on the first match, the writer gets
          # SIGPIPE, and under pipefail a found match reads as "no match".
          # `grep ... >/dev/null` consumes the whole stream.

          # Release-please fast path: same-repo release-please branch AND a
          # diff that is only the manifest, CHANGELOG.md, and the version
          # line in package.json / apps/cli/package.json.
          release_only() {
            local allowed ver old new strip base_manifest head_manifest
            case "${HEAD_REF}" in release-please--*) ;; *) return 1 ;; esac
            [ "${HEAD_REPO}" = "${REPOSITORY}" ] || return 1
            allowed='^(\.release-please-manifest\.json|CHANGELOG\.md|package\.json|apps/cli/package\.json)$'
            if printf '%s\n' "$changed" | grep -vE "$allowed" | grep . >/dev/null; then
              return 1
            fi
            ver='s/.*"\.": *"([^"]+)".*/\1/p'
            old="$(git show "${BASE_SHA}:.release-please-manifest.json" \
              | sed -nE "$ver")" || return 1
            new="$(sed -nE "$ver" .release-please-manifest.json)"
            [ -n "$old" ] && [ -n "$new" ] && [ "$old" != "$new" ] || return 1
            strip='s/"\.": *"[^"]+"/".": ""/'
            base_manifest="$(git show "${BASE_SHA}:.release-please-manifest.json" \
              | sed -E "$strip")" || return 1
            head_manifest="$(sed -E "$strip" .release-please-manifest.json)"
            [ "$head_manifest" = "$base_manifest" ] || return 1
            if git diff -U0 "${BASE_SHA}...HEAD" -- package.json apps/cli/package.json \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vxF -e "-  \"version\": \"${old}\"," -e "+  \"version\": \"${new}\"," \
                | grep . >/dev/null; then
              return 1
            fi
          }
          if release_only; then
            emit false true false
            echo "INFO: release-please version bump - skipping heavy jobs"
            exit 0
          fi

          # README.md is markdown but NOT skippable: apps/cli packs it into
          # the published tarball, so pack-check and code jobs must run.
          skip='^docs/|^assets/|^\.vscode/|^\.cursor/|^\.windsurf|\.md$'
          skip="$skip|^LICENSE$|^\.github/ISSUE_TEMPLATE/"
          skip="$skip|^\.contributors\.jsonl$"
          code_changed=false
          if printf '%s\n' "$changed" | grep -x 'README\.md' >/dev/null \
              || printf '%s\n' "$changed" \
              | grep -vE "$skip" \
              | grep . >/dev/null; then
            code_changed=true
          fi

          web_paths='^(apps/web/|apps/api/|packages/core/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.nvmrc$|tsconfig.*\.json$|Justfile$|\.github/workflows/ci\.yml$)'
          web_changed=false
          if printf '%s\n' "$changed" | grep -E "$web_paths" >/dev/null; then
            web_changed=true
          fi

          emit "$code_changed" false "$web_changed"
          echo "INFO: code=${code_changed} web=${web_changed}"

  # Always runs (even on docs-only PRs) so markdown links, formatting, shell
  # scripts, workflows, and lint are always validated.
  lint:
    name: lint
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        id: setup
        run: pnpm install --frozen-lockfile
      - name: Install shell lint tools and EditorConfig checker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          just install-shell-tools
          just install-editorconfig-checker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check shell scripts and workflows
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-shell check-workflows
      - name: Check EditorConfig
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-editorconfig
      - name: Check spelling
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-spelling
      - name: Check formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just format-check
      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just lint
      - name: Docs link check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just docs-check
      - name: Run hook suite (all files)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec lefthook run pre-commit --all-files

  typecheck:
    name: typecheck
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        id: setup
        run: pnpm install --frozen-lockfile
      - name: Architecture boundaries (D-042)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-boundaries
      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just typecheck

  test:
    name: test (${{ matrix.os }} / node-${{ matrix.node-version }})
    runs-on: >-
      ${{
        matrix.os == 'ubuntu' && (vars.RUNNER_UBUNTU || 'ubuntu-latest') ||
        matrix.os == 'macos' && (vars.RUNNER_MACOS || 'macos-latest') ||
        matrix.os == 'windows' && (vars.RUNNER_WINDOWS || 'windows-latest') ||
        matrix.os
      }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        node-version: ['24.x']
        include:
          - os: ubuntu
            node-version: '26.x'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: just build
      - name: Test with coverage
        if: matrix.os == 'ubuntu' && matrix.node-version == '24.x'
        run: just coverage
      - name: Test
        if: ${{ !(matrix.os == 'ubuntu' && matrix.node-version == '24.x') }}
        run: just test
      - name: Upload coverage to Codecov
        # Only the ubuntu / Node 24.x matrix cell collects/uploads coverage.
        # use_oidc: tokenless upload (public repo). Requires `id-token: write`.
        if: matrix.os == 'ubuntu' && matrix.node-version == '24.x'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  pack-check:
    name: pack-check
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.release == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: just build
      - name: Packaging validation and smoke test (just pack-check)
        run: just pack-check

  # Proves apps can be deleted and the core + root tooling still pass (D-040/D-042).
  check-removable:
    name: check-removable
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        id: setup
        run: pnpm install --frozen-lockfile
      - name: Removable app check (apps/cli)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-removable cli
      - name: Removable app check (apps/api + apps/web)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-removable api web
      - name: Removable app check (apps/web)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: just check-removable web

  # API container (D-050): build the image, smoke-test it, check graceful SIGTERM stop.
  api-image:
    name: api-image
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t ts-launch-blueprint-api .
      - name: Run the image
        run: docker run -d --name api -p 8080:8080 ts-launch-blueprint-api
      - name: Smoke-test the running container
        run: sh scripts/smoke-api.sh http://localhost:8080 10
      - name: Stop gracefully (SIGTERM) and check exit code 0
        run: |
          docker stop api
          docker logs api
          code="$(docker inspect -f '{{.State.ExitCode}}' api)"
          echo "exit code: ${code}"
          test "${code}" = "0"
      - name: Remove the container
        if: always()
        run: docker rm -f api || true

  # ADVISORY, NON-GATING Bun dev/test lane (D-036).
  bun-lane:
    name: bun-lane (advisory, non-gating)
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (Node)
        run: just build
      - name: Test under Bun (non-e2e tiers)
        run: bun run vitest run --exclude tests/e2e.test.ts

  # Playwright Chromium browser E2E for apps/web against built apps/api (Q6.A).
  # Step-guarded on apps/web/package.json existence so trimmed/pressed repos
  # without apps/web skip cleanly.
  web-e2e:
    name: web-e2e
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check whether apps/web exists
        id: web-check
        run: |
          if [ -f apps/web/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "INFO: apps/web/package.json not present - skipping web-e2e"
          fi
      - name: Install pnpm
        if: steps.web-check.outputs.exists == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3
          standalone: true
      - name: Set up Node.js
        if: steps.web-check.outputs.exists == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - name: Install just
        if: steps.web-check.outputs.exists == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Install dependencies
        id: setup
        if: steps.web-check.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw-version
        if: ${{ !cancelled() && steps.web-check.outputs.exists == 'true' && steps.setup.outcome == 'success' }}
        run: |
          PW_VERSION="$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")"
          echo "version=${PW_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium browser
        id: playwright-cache
        if: ${{ !cancelled() && steps.web-check.outputs.exists == 'true' && steps.setup.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - name: Install Playwright Chromium and OS deps
        if: ${{ !cancelled() && steps.web-check.outputs.exists == 'true' && steps.setup.outcome == 'success' && steps.playwright-cache.outputs.cache-hit != 'true' }}
        run: pnpm --filter @ts-launch-blueprint/web exec playwright install chromium --only-shell --with-deps
      - name: Install Playwright OS deps (cache hit)
        if: ${{ !cancelled() && steps.web-check.outputs.exists == 'true' && steps.setup.outcome == 'success' && steps.playwright-cache.outputs.cache-hit == 'true' }}
        run: pnpm --filter @ts-launch-blueprint/web exec playwright install-deps chromium
      - name: Run Playwright Chromium E2E
        if: ${{ !cancelled() && steps.web-check.outputs.exists == 'true' && steps.setup.outcome == 'success' }}
        run: just test-web-e2e
      - name: Upload Playwright report on failure
        if: ${{ failure() && steps.web-check.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Single required status gate: skipped jobs count as success; failure or
  # cancellation fails the gate.
  ci-ok:
    name: ci-ok
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    timeout-minutes: 5
    needs:
      - changes
      - lint
      - typecheck
      - test
      - pack-check
      - check-removable
      - api-image
      - bun-lane
      - web-e2e
    if: always()
    permissions: {}
    steps:
      - name: Check aggregate result
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "FAIL: at least one required job did not succeed" >&2
              exit 1
            fi
          done
          echo "PASS: all required jobs succeeded or were skipped"
