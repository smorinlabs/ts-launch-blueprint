# Dependency Review Action (D-022(5)).
#
# This Action scans dependency manifest files that change as part of a Pull
# Request, surfacing known-vulnerable versions of the packages declared or
# updated in the PR. `pnpm-lock.yaml` is read by the GitHub dependency graph
# (pnpm's ecosystem id stays `npm`; D-035), so this carries over from the
# Python source unchanged apart from the v4 -> v5 bump.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
# Dependency Review requires GitHub Code Security in private repositories; the
# job activates automatically on the next PR after the repository becomes public.
name: 'Dependency review'
on:
  pull_request:
    branches: ['main']

# If using a dependency submission action in this workflow this permission will need to be set to:
#
# permissions:
#   contents: write
#
# https://docs.github.com/en/enterprise-cloud@latest/code-security/supply-chain-security/understanding-your-software-supply-chain/using-the-dependency-submission-api
permissions:
  contents: read
  # Write permissions for pull-requests are required for the `comment-summary-in-pr`
  # option below; comment out if you disable that option (D-022(10)).
  pull-requests: write

jobs:
  dependency-review:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
        with:
          # No job here pushes; drop the persisted token (zizmor artipacked).
          persist-credentials: false
      # SHA-pinned even though this is an official actions/* action:
      # dependency-review-action publishes NO floating major tag (no `v5`,
      # and no `v4` either — the Python source's `@v4` carried this exact
      # latent resolution bug); only exact tags like v5.0.0 exist, so a
      # `@v5` ref would fail to resolve on first run. Dependabot's
      # github-actions ecosystem keeps the SHA fresh.
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        # Commonly enabled options, see https://github.com/actions/dependency-review-action#configuration-options for all available options.
        with:
          comment-summary-in-pr: always
          #   fail-on-severity: moderate
          #   allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC
          #   retry-on-snapshot-warnings: true
