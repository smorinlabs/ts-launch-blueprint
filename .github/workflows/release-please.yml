# SPDX-License-Identifier: MIT

# Release-please (D-021(1,3,5)): every push to main is scanned for Conventional
# Commits; release-please maintains a "Release PR" that bumps package.json +
# .release-please-manifest.json and regenerates CHANGELOG.md. Merging that PR
# tags `vX.Y.Z`, which is what triggers publish.yml. Versions are therefore
# NEVER hand-edited — the bot PR owns them (the hatch-vcs "never hand-edit"
# intent, ported).
#
# pnpm-lock.yaml does not encode the root project's own version. The generated
# release commit is therefore complete as-is: do not add a post-creation lock
# synchronization commit, which would expose an inconsistent intermediate PR
# revision to CI and automated reviewers.

name: Release Please

on:
  push:
    branches: [main]
  # Manual re-trigger if a push event was missed.
  workflow_dispatch:

# Deny-all baseline (D-022(10)); the job re-grants the least-privilege set.
permissions: {}

# Never cancel an in-flight release-PR update; serialize instead.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      # Create/update the Release PR, its branch, and the release + tag.
      contents: write
      # Open/update the Release pull request.
      pull-requests: write
    env:
      # Surfaced so the app-token step's `if:` can test it (secrets are not
      # readable in `if:` conditions directly).
      RP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
    steps:
      # App token (D-021(5)): tags pushed with GITHUB_TOKEN cannot trigger
      # other workflows, so merging a Release PR would never fire publish.yml.
      # Mint a short-lived App installation token instead; fallback is the
      # RELEASE_PLEASE_APP_TOKEN fine-grained PAT. GITHUB_TOKEN is
      # intentionally NOT a fallback — with neither configured, fail fast.
      - name: Mint release-please app token
        id: app-token
        if: ${{ env.RP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      # Third-party action → full-SHA pin + version comment (D-022(9)); kept
      # fresh by the Dependabot github-actions ecosystem.
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_APP_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
