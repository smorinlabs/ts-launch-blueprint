# SPDX-License-Identifier: MIT
# Scheduled weekly dependency vulnerability audit (pnpm audit + osv-scanner) with rolling tracking issue.

name: weekly-audit

on:
  schedule:
    - cron: '0 5 * * 1' # weekly, Monday 05:00 UTC (after dependabot's run)
  workflow_dispatch:

permissions: {}

concurrency:
  group: dep-audit
  cancel-in-progress: true

jobs:
  pnpm-audit:
    name: pnpm-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Audit against known vulnerabilities
        run: pnpm audit --audit-level=high

  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --recursive
            ./

  file-tracking-issue:
    name: file-tracking-issue
    needs: [pnpm-audit, osv-scanner]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: File or update the rolling audit-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          failed_jobs="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')"
          entry="- $(date -u +%FT%TZ) run ${RUN_ID} (\`${HEAD_SHA:0:7}\`): ${failed_jobs} — ${RUN_URL}"
          label_args=()
          labels="$(gh label list --json name --jq '.[].name' | tr '\n' ',')"
          case ",${labels}," in *,weekly-audit,*) label_args=(--label weekly-audit) ;; esac
          existing="$(gh issue list ${label_args[@]+"${label_args[@]}"} --state open --limit 500 --json number,body --jq '[.[] | select(.body != null and (.body | contains("<!-- weekly-audit-tracking -->"))) | .number][0] // empty')"
          tracking_body="${RUNNER_TEMP:-/tmp}/tracking-body.md"
          if [ -n "$existing" ]; then
            body="$(gh issue view "$existing" --json body --jq .body)"
            printf '%s\n' "$body" | awk -v entry="$entry" '
              BEGIN { in_entries = 0; kept = 1 }
              /^## Failures \(newest first\)$/ { print; print entry; in_entries = 1; next }
              in_entries && /^- [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T/ { kept++; if (kept > 30) next }
              in_entries && /^## / { in_entries = 0 }
              { print }
            ' > "$tracking_body"
            gh issue edit "$existing" --body-file "$tracking_body"
          else
            {
              echo '<!-- weekly-audit-tracking -->'
              echo
              echo "The scheduled \`weekly-audit\` run failed. Triage each entry, then close"
              echo 'this issue when the backlog is clear (a later red run opens a fresh one).'
              echo
              echo '## Failures (newest first)'
              echo
              echo "$entry"
              echo
              echo '## Notes'
              echo
              echo "- Diagnosis and fix PRs come from the \`audit-triage\` workflow runs linked above."
            } > "$tracking_body"
            gh issue create --title 'weekly-audit failures need triage' ${label_args[@]+"${label_args[@]}"} --body-file "$tracking_body"
          fi
