# SPDX-License-Identifier: MIT

# Publish (D-021(5), D-012(5), ADR 0017 / Q13.A / Q14.A): a `v*` tag (pushed
# when a release-please Release PR is merged) triggers a cheap `verify` gate
# that must pass before the environment-gated publish jobs run.
#
# - `publish` publishes `apps/cli` (`ts-launch-blueprint`) via OIDC Trusted
#   Publishing (no long-lived publish secret anywhere).
# - `publish-core` runs in parallel when `vars.PUBLISH_CORE == 'true'` (Q14.A),
#   packing `packages/core` (`ts-launch-blueprint-core`) with `pnpm pack` (so
#   `publishConfig.exports` rewrites exports to `./dist/*`) and publishing that
#   tarball with `npm publish <tarball> --access public` via OIDC Trusted
#   Publishing. `verify` always runs `just pack-check` on BOTH packages.

name: Publish

on:
  push:
    tags:
      - 'v*'
  # Manual dispatch fallback (must target a v* tag, never a branch).
  workflow_dispatch:

# Deny-all baseline (D-022(10)); each job below re-grants only what it needs.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- Cheap, un-privileged integrity gate: never contacts the registry. -----
  verify:
    name: verify-release
    runs-on: ubuntu-latest
    permissions:
      # Read-only checkout + history for the ancestry check; nothing writes.
      contents: read
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          # Need the whole graph to prove the tag descends from main.
          fetch-depth: 0
          # No job here pushes; drop the persisted token (zizmor artipacked).
          persist-credentials: false

      # pnpm before setup-node so cache:'pnpm' finds the store (D-035).
      # Third-party action → full-SHA pin + version comment (D-022(9)).
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm >= 11 (Trusted Publishing needs >= 11.5.1).
          node-version: '24.x'
          cache: 'pnpm'

      # Third-party action → full-SHA pin + version comment (D-022(9)); kept
      # fresh by the Dependabot github-actions ecosystem.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Assert tag is an ancestor of main (D-021(5))
        run: |-
          set -euo pipefail
          # Triggered or manually dispatched runs must target a v* tag, never a branch.
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [ "${GITHUB_REF_NAME#v}" = "${GITHUB_REF_NAME}" ]; then
            echo "::error::Run this workflow from a v* tag (got ${GITHUB_REF_TYPE} ${GITHUB_REF_NAME})."
            exit 1
          fi
          # No re-fetch: the fetch-depth: 0 checkout above already provides
          # refs/remotes/origin/main, and persist-credentials: false leaves
          # git unauthenticated — on a private repo a fetch here dies with
          # "could not read Username" (v0.1.2's publish failed exactly so).
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not reachable from main."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} is an ancestor of main."

      - name: Assert tag == root/core/cli package.json == manifest version (D-021(5)/D-022(13)/ADR 0017)
        run: |-
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          CORE_VERSION="$(node -p "require('./packages/core/package.json').version")"
          CLI_VERSION="$(node -p "require('./apps/cli/package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./.release-please-manifest.json')['.']")"
          echo "tag=${TAG_VERSION} root=${ROOT_VERSION} core=${CORE_VERSION} cli=${CLI_VERSION} manifest=${MANIFEST_VERSION}"
          if [ "${TAG_VERSION}" != "${ROOT_VERSION}" ] \
              || [ "${TAG_VERSION}" != "${CORE_VERSION}" ] \
              || [ "${TAG_VERSION}" != "${CLI_VERSION}" ] \
              || [ "${TAG_VERSION}" != "${MANIFEST_VERSION}" ]; then
            echo "::error::Version mismatch between tag, root/core/cli package.json, and manifest."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install lint tools
        run: |
          just install-shell-tools
          just install-editorconfig-checker
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Quality gates (just all)
        run: just all

      - name: Packaging validation and smoke tests (just pack-check)
        run: just pack-check

  # --- CLI registry publish: runs ONLY inside the protected `npm` environment,
  #     after human approval, on GitHub-hosted runners. Never runs locally. ---
  publish:
    name: publish-npm
    needs: verify
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers on GitHub so a human
    # must approve before this job runs (preserves the source's publish-opt-in
    # intent). The npmjs.com trusted publisher must also name this environment.
    environment: npm
    permissions:
      contents: read
      # Mint the OIDC token npm exchanges for a short-lived publish credential
      # (Trusted Publishing). This is the ONLY auth — no long-lived secret.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # pnpm before setup-node so cache:'pnpm' finds the store (D-035).
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1 and
          # Node >= 22.14.0 on a GitHub-hosted runner. Node 24 bundles a
          # compliant npm; if a runner ever ships an older npm, add a
          # `npm install -g npm@latest` step before publishing.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter ts-launch-blueprint build

      # Install/build run under pnpm, but the publish itself uses the npm CLI
      # (D-035): pnpm 10's `pnpm publish` OIDC delegation has an unresolved
      # Trusted-Publishing field-failure report (pnpm#9812), so plain
      # `npm publish` — Node 24's bundled npm >= 11.5.1 meets the floor — is the
      # reliable OIDC path. No publish secret: authenticated by the id-token
      # OIDC exchange above. Provenance attestations are generated automatically
      # for public repos under Trusted Publishing.
      # Strip-guard (canonical form, repo-please-setup 0.7.0): npm publish
      # auto-corrects bin entries warning-only, and its delete paths
      # (`removed invalid "bin[..]"`, `empty "bin" was removed`) ship the
      # package WITHOUT its CLI — messages the previous grep never matched.
      # Strict by design: ANY bin auto-correction fails the job; fix
      # package.json rather than trust npm's cleaning.
      - name: Fail on any npm bin auto-correction
        working-directory: apps/cli
        run: |
          set -euo pipefail
          npm publish --dry-run 2>&1 | tee /tmp/npm-dry-run.log
          if grep -Eq '"bin\[|empty "bin" was removed' /tmp/npm-dry-run.log; then
            echo "FAIL: npm would auto-correct the bin field on publish" >&2
            exit 1
          fi

      - name: Publish CLI to npm (Trusted Publishing / OIDC)
        working-directory: apps/cli
        run: npm publish

  # --- Core library registry publish (opt-in via vars.PUBLISH_CORE == 'true',
  #     Q14.A / ADR 0017): runs in parallel with `publish` so core setup never
  #     blocks CLI releases. Packs via `pnpm pack` (rewriting
  #     publishConfig.exports -> ./dist/*) and publishes that tarball with
  #     `npm publish <tarball> --access public` over OIDC Trusted Publishing. ---
  publish-core:
    name: publish-core-npm
    needs: verify
    if: vars.PUBLISH_CORE == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.3

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core library
        run: pnpm --filter ts-launch-blueprint-core build

      - name: Pack and publish core library to npm (Trusted Publishing / OIDC)
        working-directory: packages/core
        run: |
          set -euo pipefail
          SCRATCH="$(mktemp -d "${TMPDIR:-/tmp}/publish-core.XXXXXX")"
          trap 'rm -rf "$SCRATCH"' EXIT
          pnpm pack --pack-destination "$SCRATCH"
          TARBALL="$(find "$SCRATCH" -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
          if [ -z "$TARBALL" ] || [ ! -f "$TARBALL" ]; then
            echo "::error::pnpm pack did not produce a tarball for packages/core."
            exit 1
          fi
          npm publish "$TARBALL" --access public
