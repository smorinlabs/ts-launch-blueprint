# SPDX-License-Identifier: MIT
# cspell:ignore smorinlabs

# Automated contributors-list bot PR (D-022(11), D-024(9), P13-T07).
#
# Replaces the Python source's separate generation script + create-pull-request
# pipeline with smorinlabs/contributors-please-action in `mode: pull-request`.
#
# Triggers on push to `main` (ignoring CONTRIBUTORS.md and .contributors.jsonl
# so bot merges never loop) plus `workflow_dispatch`. Does NOT use `[skip ci]`
# in `commit-message` so required PR checks still run on bot PRs.
#
# Credentials: `pat` uses GITHUB_TOKEN out of the box, while optional
# CONTRIBUTORS_PLEASE_CLIENT_ID / CONTRIBUTORS_PLEASE_PRIVATE_KEY secrets take
# precedence when configured.
name: Update Contributors

on:
  push:
    branches: [main]
    paths-ignore:
      - CONTRIBUTORS.md
      - .contributors.jsonl
  workflow_dispatch:

# Deny-all baseline (D-022(10)); the job re-grants the least-privilege set
# contributors-please needs to commit, open, and label a PR.
permissions: {}

jobs:
  update-contributors:
    runs-on: ${{ vars.RUNNER_UBUNTU || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Third-party action → full-SHA pin + version comment (D-022(9)); kept
      # fresh by the Dependabot github-actions ecosystem.
      - name: Update contributors list
        uses: smorinlabs/contributors-please-action@3c6dbff9ef21190aa1f63b3c400ed4f0ab404ac1 # v1.3.9
        with:
          # The input name is app-id but the value is the App's Client ID
          # (the action accepts it; repo-secrets provisions *_CLIENT_ID).
          app-id: ${{ secrets.CONTRIBUTORS_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.CONTRIBUTORS_PLEASE_PRIVATE_KEY }}
          pat: ${{ secrets.GITHUB_TOKEN }}
          mode: pull-request
          output-file: CONTRIBUTORS.md
          state-file: .contributors.jsonl
          config-file: .contributors.yml
          bootstrap: 'true'
          # Omit [skip ci] (action default): [skip ci] suppresses pull_request
          # workflows required by main branch protection, deadlocking bot PRs.
          # Loop prevention relies on paths-ignore above instead.
          commit-message: 'docs: update contributors'
